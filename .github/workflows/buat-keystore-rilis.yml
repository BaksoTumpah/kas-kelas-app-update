name: Buat Keystore Rilis

# Jalankan SEKALI dari tab Actions > "Buat Keystore Rilis" > Run workflow.
# Hasilnya berupa artifact "keystore-rilis" (zip) berisi kunci + nilai 4 secret. Unduh, simpan di tempat aman
# (SIMPAN KUNCI INI: kalau hilang, APK tidak bisa diperbarui di atas versi lama), isi 4 secret di
# Settings > Secrets and variables > Actions, lalu HAPUS artifact-nya (Actions > run ini > Artifacts > hapus).
on:
  workflow_dispatch:
    inputs:
      nama:
        description: 'Nama pemilik kunci (tanpa koma), contoh: Kas Kelas'
        required: true
        default: 'Kas Kelas'

jobs:
  buat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Buat keystore
        env:
          NAMA: ${{ github.event.inputs.nama }}
        run: |
          mkdir out
          PASS=$(openssl rand -hex 12)
          ALIAS=kaskelas
          NAMA_AMAN=$(echo "$NAMA" | tr -d ',=+<>#;"\\')
          keytool -genkeypair -v -keystore out/kas-kelas-release.keystore -storetype PKCS12 -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=$NAMA_AMAN, O=Kas Kelas, C=ID"
          base64 -w0 out/kas-kelas-release.keystore > out/RELEASE_KEYSTORE_BASE64.txt
          {
            echo "RELEASE_KEYSTORE_BASE64   = (isi file RELEASE_KEYSTORE_BASE64.txt)"
            echo "RELEASE_KEYSTORE_PASSWORD = $PASS"
            echo "RELEASE_KEY_ALIAS         = $ALIAS"
            echo "RELEASE_KEY_PASSWORD      = $PASS"
          } > out/ISI-4-SECRET.txt
          SHA1=$(keytool -list -v -keystore out/kas-kelas-release.keystore -storepass "$PASS" -alias "$ALIAS" | grep "SHA1:" | head -1 | sed 's/.*SHA1: //')
          echo "$SHA1" > out/SHA1.txt
          echo "### Keystore rilis dibuat. SHA-1: \`$SHA1\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-rilis
          path: out
          retention-days: 3
