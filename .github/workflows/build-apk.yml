name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform (kalau belum ada)
        run: test -d android || npx cap add android

      - name: Sync Capacitor (salin kode web ke project Android)
        run: npx cap sync android

      # Langkah paling penting untuk ikon: generate ikon DARI resources/icon.png
      # ke semua ukuran yang dibutuhkan Android, lalu tampilkan isi foldernya
      # di log supaya kelihatan jelas kalau berhasil/gagal.
      - name: Generate app icons dari resources/icon.png
        run: |
          echo "Sumber ikon:"
          ls -la resources/
          npx capacitor-assets generate --android
          echo "Hasil ikon yang digenerate:"
          find android/app/src/main/res -iname "ic_launcher*" | sort

      # Keystore & password diambil dari GitHub Secrets, TIDAK pernah ditulis ke repo.
      - name: Siapkan keystore rilis dari Secrets
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/kas-kelas-release.keystore
          cat > android/keystore.properties << PROPS
          storeFile=kas-kelas-release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS

      - name: Build APK bertanda tangan (release)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Build APK debug (kalau Secrets keystore belum diisi)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kas-kelas-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
