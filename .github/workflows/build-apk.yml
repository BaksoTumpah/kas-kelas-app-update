name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang kunci tanda tangan tetap
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Kunci tetap terpasang."
          else
            echo "::warning::Secret DEBUG_KEYSTORE_BASE64 belum diisi. APK memakai kunci acak, login Google akan gagal (kode 10)."
          fi

      - name: Install Dependencies
        run: npm install

      - name: Tambah platform Android (kalau belum ada)
        run: test -d android || npx cap add android

      - name: Siapkan login Google
        run: |
          python3 - <<'PYEOF'
          import json, re, os
          cfg_path = 'capacitor.config.json'
          if os.path.exists(cfg_path):
              cfg = json.load(open(cfg_path, encoding='utf-8'))
              ga = cfg.get('plugins', {}).get('GoogleAuth', {})
              cid = (ga.get('serverClientId') or '').strip()
              if not cid or cid.startswith('GANTI'):
                  print('::warning::serverClientId di capacitor.config.json belum diisi. Login Google Drive tidak akan berfungsi.')
              else:
                  ga['clientId'] = cid
                  ga['androidClientId'] = cid
                  json.dump(cfg, open(cfg_path, 'w', encoding='utf-8'), indent=2, ensure_ascii=False)
                  sx = 'android/app/src/main/res/values/strings.xml'
                  if os.path.exists(sx):
                      s = open(sx, encoding='utf-8').read()
                      s = re.sub(r'\s*<string name="server_client_id">.*?</string>', '', s)
                      s = s.replace('</resources>', '    <string name="server_client_id">%s</string>\n</resources>' % cid)
                      open(sx, 'w', encoding='utf-8').write(s)
                  print('Client ID Google terpasang:', cid[:14] + '...')
          PYEOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Buat ikon aplikasi
        run: |
          if [ -f assets/icon.png ]; then
            npx capacitor-assets generate --android --iconBackgroundColor '#6c9c3d' --iconBackgroundColorDark '#6c9c3d' \
              && echo "Ikon dibuat:" && find android/app/src/main/res -iname "ic_launcher*" | sort \
              || echo "::warning::Pembuatan ikon gagal, APK memakai ikon bawaan."
          else
            echo "::warning::assets/icon.png tidak ditemukan, APK memakai ikon bawaan."
          fi

      - name: Build APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Tampilkan SHA-1 APK
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "APK: $APK"
          SHA1=$(keytool -printcert -jarfile "$APK" | grep "SHA1:" | sed 's/.*SHA1: //')
          echo "SHA-1 APK: $SHA1"
          {
            echo "### SHA-1 sertifikat APK"
            echo ""
            echo "\`$SHA1\`"
            echo ""
            echo "Daftarkan di Google Cloud Console > Credentials > OAuth client tipe Android."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kas-kelas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
