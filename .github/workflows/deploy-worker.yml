name: Deploy Worker Telegram (Cloudflare)

# Berjalan otomatis saat worker/telegram-worker.js berubah, atau manual: tab Actions > pilih workflow ini > Run workflow.
on:
  push:
    branches: [main]
    paths: ['worker/telegram-worker.js', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

env:
  WORKER_NAME: icy-truth-bbad

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unggah Worker ke Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Secret CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID belum diisi di GitHub (Settings > Secrets and variables > Actions). Deploy dilewati."
            exit 0
          fi
          # keep_bindings: KV, variabel, dan secret yang sudah ada di Cloudflare (BOT_TOKEN, SECRET, G_*, dst.) TIDAK dihapus.
          # Cron Trigger diatur terpisah di Cloudflare dan tidak tersentuh.
          RES=$(curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F 'metadata={"main_module":"worker.js","compatibility_date":"2025-01-01","keep_bindings":["kv_namespace","plain_text","secret_text","json","analytics_engine","durable_object_namespace","service"]};type=application/json' \
            -F 'worker.js=@worker/telegram-worker.js;type=application/javascript+module;filename=worker.js')
          echo "$RES" | head -c 1500
          echo "$RES" | grep -Eq '"success": *true' || { echo "::error::Deploy ke Cloudflare gagal (lihat pesan di atas). Worker lama tetap berjalan."; exit 1; }
          echo "Deploy berhasil."
